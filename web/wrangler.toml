# Cloudflare Pages config for the dashboard (spec Phase 4). The Pages
# project's "Root directory" in the Cloudflare dashboard must be set to
# "web" so it finds this file plus functions/ and the Vite build output.
#
# database_id below is a placeholder -- `wrangler d1 create product-radar`
# prints the real one; paste it in before the first deploy (see the Phase 4
# walkthrough). It is not a secret (it's just an identifier, not a
# credential), so it's fine to commit.
name = "product-radar"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "product-radar"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
