# All tunable numbers from spec section 6, in one place per instruction 0.6
# ("weights and thresholds live in YAML config, not in code"). Section
# references point back to PRODUCT_RADAR_SPEC.md. Phase 5 re-learns composite
# and momentum weights and will version this file.
#
# NOTE (Phase 0a): engine/run.py (the pipeline) does not exist yet, so nothing
# loads this file at runtime yet -- the pure functions in engine/*.py take
# these same numbers as keyword-argument defaults. If you change a number here,
# change the matching default too (see CLAUDE.md).

zscore:
  mad_scale: 1.4826
  clip: 3.0
  min_group_size: 8 # section 6 intro: below this, z() falls back to ungrouped

momentum: # section 6.2 (updated with the leading-indicator term, spec commit b793b5a)
  slope14_weight: 0.35
  wow_weight: 0.20
  accel_weight: 0.15
  lead_weight: 0.30 # growth in creators+videos promoting the product, last 7d vs prior 7d

stages: # section 6.3
  emerging:
    slope14_min: 0.05
    creator_count_percentile_max: 0.40
  rising:
    slope14_min: 0.02
  peak:
    slope14_abs_max: 0.02
    units_percentile_min: 0.75 # "top quartile"
  evergreen:
    weeks_tracked_min: 6
    weeks_window: 8
    slope14_abs_max: 0.02
  declining:
    slope14_max: -0.02
    consecutive_runs: 2
    rank_drop_min: 20

earnings: # section 6.4
  min_earnings_per_sale_usd: 1.50

opportunity: # section 6.5
  saturation_weight: 0.5

fit: # section 6.6
  shrink_k_views: 200000
  price_fit_sigma: 0.5
  sweet_spot_usd: [25, 55] # mirrors categories.yaml price_sweet_spot_usd
  min_tracked_videos_for_own_price_fit: 30
  target_category_boost: 0.15
  feedback_penalty: 0.1
  feedback_penalty_weeks: 8
  weights:
    category_prior: 0.6
    price_fit: 0.25
    audience_fit: 0.15
  audience_fit_weights: # within the audience_fit term above (added 2026-10-14)
    spanish: 0.5
    demographic: 0.5
  demographic_fit_heuristic_boost: 0.65 # used only when FastMoss has no buyer-demographics field
  spanish_gap_reason_max_share: 0.3 # added 2026-10-16: below this spanish_share there's a real gap worth citing

seasonality: # section 6.7
  event_lookahead_days: 21
  weights:
    event: 0.6
    personal: 0.4

risk: # section 6.9
  low_earnings_penalty: 1.5 # E < $1.50
  price_volatility_cv_threshold: 0.25 # std/mean of price over 4 weeks
  price_volatility_penalty: 0.5
  low_rating_threshold: 4.0
  low_rating_penalty: 1.0
  high_creator_saturation_percentile: 0.95
  high_creator_saturation_penalty: 0.5
  low_unit_price_usd: 10
  low_unit_price_penalty: 0.5
  low_unit_price_commission_exempt_pct: 20 # no penalty if commission >= this
  high_ads_share_pct_threshold: 60 # product_overview ad/organic split (spec commit b793b5a)
  high_ads_share_penalty: 0.5

composite: # section 6.10
  demand: 0.10
  momentum: 0.25
  log_earnings: 0.20
  opportunity: 0.15
  fit: 0.15
  seasonality: 0.10
  spanish_gap: 0.05
  risk_penalty: 0.40 # subtracted

expected_value: # section 6.11
  momentum_multiplier:
    slope14_coef: 7
    min: 0.5
    max: 2.0
  saturation_multiplier:
    coef: 0.3
    min: 0.6
    max: 1.2

picks: # section 6.12 / 6.13
  core_slots: 7
  explore_slots: 2
  evergreen_slots: 1
  max_per_category: 3
  max_per_shop: 2
  max_per_brand: 1 # added 2026-10-19: stricter than max_per_shop -- the same brand can sell through more than one shop
  min_moda_core_picks: 2 # added 2026-10-19: real case, 2026-W42's Top 9 had zero fajas/vestidos/conjuntos
  min_hogar_picks: 2 # same date -- Hogar was also under-represented that week
  title_jaccard_duplicate_threshold: 0.6
  rank_blend:
    score_weight: 0.5
    ev_weight: 0.5
  recent_film_exclusion_days: 30
  explore_min_trials_considered_tested: 5 # not specified by spec; our own default for Thompson sampling
  # Per-event pick caps (e.g. "max 1 Halloween pick") now live on the event itself
  # in config/seasons.yaml (`max_picks`), not here -- a single global number
  # can't distinguish a scarcity event like Halloween from a broad scoring
  # boost like Black Friday that's meant to match most categories.

quality: # suspicious-listing filter, added 2026-10-15 after a real same-shop/
  # same-round-price/boilerplate-title cluster slipped through scoring untouched
  price_outlier_multiplier: 4.0 # price > this x the category median price
  round_price_divisor: 50 # a price is "suspiciously round" if it's an exact multiple of this
  round_price_min_cluster: 2 # min unrelated same-shop-same-price products to flag the cluster
  low_density_gmv_threshold: 20000 # "high GMV" floor for the low-creator-density check
  low_density_min_creators: 5 # below this creator_count (when known) + high GMV = flagged
  low_affiliate_share_threshold_pct: 20 # affiliate-channel GMV share below this = not content-driven

seasonality_extra: # added 2026-10-15
  season_ending_warning_days: 14
  season_ending_floor: 0.3 # minimum multiplier once a film window is about to close
  boosted_category_multiplier: 1.3 # extra lift for a season's boosted_categories (e.g. Black Friday)

credits: # section 9
  hard_cap_per_run: 75 # absolute ceiling regardless of the dynamic budget below -- a last-resort guard
  skip_optional_stages_below_balance: 150
  digest_warn_month_projection_above: 400
  daily_series_refetch_min_days: 6
  # --budget is no longer a fixed number when not passed explicitly on the
  # CLI -- engine.run.main() computes it via engine.budget.dynamic_weekly_
  # budget from the REAL current balance (a free check, plan + never-
  # expiring top-up credits combined), this reset date, and one flat
  # safety floor, splitting what's left across the Mondays remaining.
  # Matches worker/wrangler.toml's CREDIT_RESET_DATE (keep both in sync).
  reset_date: "2026-11-15"
  # Simplified 2026-10-16 after the 2,000-credit top-up: one flat floor
  # (instead of two itemized per-purpose reserves) big enough to cover
  # Buscar cuenta searches and 7b's monthly live-timing pull together, so
  # Monday's run is never blocked regardless of what else drew on the
  # balance that week.
  safety_floor_credits: 300

enrichment: # Part 1c of the 2026-10-15 creator-workflow upgrade
  # Tiered so a real month's budget covers videos/hashtags for more than
  # just SHORTLIST_SIZE=12 products (only 29 of 250 ever had videos under
  # the old flat scheme): the top trend_tier_size get BOTH sales_trend
  # (2cr) and product_video_list (1cr); the wider video_tier_size get only
  # product_video_list. Both skip the paid call entirely when
  # find_recent_snapshot finds one from the last video_cache_max_weeks.
  trend_tier_size: 15
  video_tier_size: 30
  video_cache_max_weeks: 4

formula_ganadora: # Part B of the 2026-10-15 creator-workflow upgrade
  # Her real length_sweet_spot (web/public/data/insights.json): 13-20s and
  # 21-30s both clearly outperform <=12s and 31s+ on gmv_per_video --
  # engine/formula.py's ideal_duration_seconds falls back to this range
  # only when a product has no real video duration data at all.
  creator_sweet_spot_seconds: [13, 30]

saturation_badge: # Part E of the 2026-10-15 creator-workflow upgrade
  # See engine/saturation.py's module docstring for why these are a static
  # creators-per-100-units-sold-this-week ratio, not a creator growth rate.
  creators_per_100_units_entra_ya_max: 2.0
  creators_per_100_units_muy_lleno_min: 6.0
  units_slope_growing_min: 0.02 # same slope14 units as weights.stages.rising.slope14_min

pocas_latinas: # H5 of the 2026-10-15 creator-workflow upgrade
  # Reuses fit.spanish_gap_reason_max_share's own threshold for "few Spanish
  # videos" (same number the existing "spanish_gap" reason already renders
  # at) -- min_units_7d keeps the badge off low-volume products that just
  # don't have enough top videos yet to say anything about language mix.
  spanish_share_max: 0.3
  min_units_7d: 100

outreach: # H4 of the 2026-10-15 creator-workflow upgrade
  # "High commission, few creators" shop-outreach candidates, computed from
  # this week's own candidates.json (shop_name, commission_rate, creator_count
  # -- all already fetched/exported, nothing new to fetch). Percentile-based,
  # not absolute cutoffs: a real week's commission rates topped out at 25%
  # and creator_count ranged ~20-770, so a fixed "commission >= 20% AND
  # creator_count <= 10" never matched anything -- these are now relative to
  # this week's own shop distribution instead (computed client-side in
  # web/src/outreach.ts, mirrored here for reference, not read at runtime).
  commission_top_fraction: 0.5 # qualifies if avg commission is in this week's top half of shops
  creator_count_bottom_fraction: 0.5 # qualifies if avg creator_count is in this week's bottom half
  min_candidates_for_shop_avg: 1
