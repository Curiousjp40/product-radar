# Event calendar for engine/seasonality.py (section 6.7). Dates are specific to
# one yearly cycle on purpose -- re-edit this file each year rather than trying
# to make it auto-recurring; TikTok's own sale dates (Deals for You Days) move
# year to year and need confirming closer to the date anyway.
#
# film_start/film_end: the window she should actually be filming in, used for
# the "overlaps the next 21 days" event term. categories must match keys in
# categories.yaml.
#
# event_date (added 2026-10-16): the specific day people actually recognize
# (Halloween, Black Friday, ...), used ONLY for the reason's "in N days"
# countdown -- film_end is deliberately later (she should keep posting past
# the day itself, e.g. through Cyber Monday), so counting down to film_end
# gave "Black Friday in 49 days" on 2026-10-14 when the real answer is 44.
# Omitted for events that are a date RANGE with no single recognized day
# (holiday_gifting, graduation, back_to_school, deals_for_you_days) -- those
# fall back to film_end.

events:
  - id: halloween_2026
    label_es: Halloween
    label_en: Halloween
    # "costumes" is now its own real, actively-scanned category (2026-10-18)
    # -- still kept alongside title_keywords below, which catches a costume
    # that surfaces in a different category's results too.
    categories: [costumes]
    film_start: "2026-09-10"
    film_end: "2026-10-20"
    event_date: "2026-10-31"
    max_picks: 1 # added 2026-10-15: Halloween costumes were crowding out everything else this close to film_end
    title_keywords: [costume, halloween, pumpkin, witch, vampire, zombie] # real FastMoss top-selling
    # category-based event matching alone can't catch a costume that FastMoss
    # tagged under a different category (seen for real before "costumes" was
    # pinned) -- see title_matches_event_keywords

  # NOTE: max_picks is per-event, not global -- bfcm_2026 below deliberately has
  # none. It's a scoring BOOST across most of her categories (shapewear/winter
  # clothing/gifts), not a scarcity event like Halloween, so it should never cap
  # how many picks can match it (a global cap here collapsed the whole picks
  # list to 1, since bfcm_2026 matches almost every candidate once it's within
  # its 21-day lookahead window). Excludes the seasonal-tier categories
  # (costumes/pajamas/activewear) on purpose -- each already has its own
  # dedicated event/window above and shouldn't also compete for BFCM's boost.
  - id: bfcm_2026
    label_es: Black Friday / Cyber Monday
    label_en: Black Friday / Cyber Monday
    categories: [shapewear, dresses, sets, furniture, home_decor, winter_clothing, shoes, pet_furniture, home_storage, seasonal, other]
    # Moved earlier 2026-10-16 per Ryan: TikTok Shop runs its own early BF
    # deals well before the actual Black Friday date, so posting should
    # start mid-October, not Nov 1.
    film_start: "2026-10-15"
    film_end: "2026-12-02"
    event_date: "2026-11-27" # Black Friday 2026 (Thanksgiving + 1); Cyber Monday follows 2026-11-30
    boosted_categories: [shapewear, winter_clothing, home_decor, furniture] # her core + gift-adjacent categories

  - id: holiday_gifting_2026
    label_es: Regalos de temporada
    label_en: Holiday gifting
    categories: [home_decor, furniture, home_storage, seasonal, other]
    # Moved earlier 2026-10-16 per Ryan: holiday gift shopping starts well
    # before December.
    film_start: "2026-11-01"
    film_end: "2026-12-20"

  - id: winter_new_year_2026
    label_es: Invierno / Año Nuevo
    label_en: Winter / New Year
    categories: [winter_clothing, dresses, seasonal]
    film_start: "2026-12-01"
    film_end: "2027-01-15"
    event_date: "2027-01-01" # New Year's Day
    notes_en: "Thermal leggings, winter dresses"
    notes_es: "Leggings térmicos, vestidos de invierno"

  - id: valentines_2027
    label_es: San Valentín
    label_en: Valentine's Day
    categories: [dresses, sets, seasonal]
    film_start: "2027-01-20"
    film_end: "2027-02-14"
    event_date: "2027-02-14" # same as film_end here -- set explicitly for consistency, no behavior change

  - id: mothers_day_2027
    label_es: Día de las Madres / Mother's Day
    label_en: Mother's Day
    categories: [home_decor, furniture, seasonal]
    film_start: "2027-04-20"
    film_end: "2027-05-10" # later of US 2nd-Sunday-of-May (2027-05-09) and Dia de las Madres (05-10)
    event_date: "2027-05-10" # same as film_end here -- set explicitly for consistency, no behavior change
    notes_en: "US Mother's Day 2027-05-09, Dia de las Madres (fixed) 2027-05-10"
    notes_es: "Día de las Madres EEUU 2027-05-09, Día de las Madres fijo 2027-05-10"

  - id: graduation_2027
    label_es: Graduación
    label_en: Graduation
    categories: [dresses, sets, home_decor, other]
    film_start: "2027-04-01"
    film_end: "2027-05-31"

  - id: deals_for_you_days_2027
    label_es: "TikTok Deals for You Days (verano)"
    label_en: "TikTok Deals for You Days (summer)"
    categories: [home_decor, furniture, seasonal]
    film_start: null # TODO: confirm with TikTok closer to the date; 2026 instance ran Jun-Jul
    film_end: null

  - id: back_to_school_2027
    label_es: Regreso a clases
    label_en: Back to school
    categories: [dresses, sets, shoes, other]
    film_start: "2027-07-15"
    film_end: "2027-08-31"
