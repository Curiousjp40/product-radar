# Starting priors for engine/fit.py and engine/picks.py (EV calc), taken from
# spec section 2 (Roxie's FastMoss video export: top 50 shop videos).
#
# category_gpm values are GMV per 1,000 views ($) by category, read straight off
# the section 2.2 table. views (in the same block) are *derived*, not measured:
# views = gmv / gpm_per_1k * 1000, back-solved from the two numbers the spec gives.
# They exist only so fit.category_prior() has a shrinkage weight (section 6.6's
# `views_c`) until real per-product view data starts flowing from FastMoss.
#
# pooled_category_gpm was originally a views-weighted average with a second
# benchmark creator (Ari); removed 2026-10-16 (this app now supports other
# creators generically, not just Roxie-vs-Ari) -- it's now just Roxie's own
# category_gpm_per_1k_views, kept as a separate key since fit.py reads it by
# that name.

roxm___:
  handle: roxm___
  display_name: Roxie
  language: es
  median_views_per_video: 3683
  cvr_units_per_10k_views: 6.17 # units per 10,000 views
  median_gmv_per_video: 44
  price_fit_log_mean_usd: 33.5 # spec: "starts near $30 to $37"
  gmv_top1_share: 0.45
  gmv_top5_share: 0.76
  category_gpm_per_1k_views:
    shapewear: 20.79
    womens_clothing: 10.67
    beauty_hair: 5.43
    home_decor: 3.06
    seasonal: 5.10 # her Halloween rows
  category_views:
    shapewear: 517300
    womens_clothing: 559600
    beauty_hair: 604800
    home_decor: 47100
    seasonal: 228200

pooled_category_gpm_per_1k_views:
  shapewear: 20.79
  womens_clothing: 10.67
  beauty_hair: 5.43
  home_decor: 3.06
  seasonal: 5.10
