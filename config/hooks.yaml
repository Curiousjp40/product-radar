# Part C of the 2026-10-15 creator-workflow upgrade: template hooks and shot
# lists for the "Hoy" (Que grabo hoy) tab. These are generic fallbacks shown
# alongside the real best hook pulled from a product's own top videos
# (engine/formula.py's top_hooks) -- a template is only ever a starting
# point, never a replacement for what's actually selling for her.
#
# hooks: 3 per category (es + en), keyed by config/categories.yaml's own
# category keys so a new target category just needs an entry added here.
hooks:
  shapewear:
    es:
      - "¿Cómo me veo así en 10 segundos? Te lo muestro"
      - "El secreto que uso debajo de mi ropa"
      - "Antes y después que no vas a creer"
    en:
      - "How do I look like this in 10 seconds? Let me show you"
      - "The secret I wear under my clothes"
      - "Before and after you won't believe"
  dresses:
    es:
      - "El vestido que todas me preguntan"
      - "Me lo probe y no me lo quite mas"
      - "Un vestido, tres looks diferentes"
    en:
      - "The dress everyone keeps asking about"
      - "I tried it on and never took it off"
      - "One dress, three different looks"
  sets:
    es:
      - "Este conjunto resuelve mi outfit en segundos"
      - "Lo combine de 3 formas distintas"
      - "El set que parece mas caro de lo que es"
    en:
      - "This set solves my outfit in seconds"
      - "I styled it 3 different ways"
      - "The set that looks more expensive than it is"
  furniture:
    es:
      - "Asi transforme mi comedor por menos de $X"
      - "No vas a creer el antes de este mueble"
      - "Arme esto en menos de 10 minutos"
    en:
      - "This is how I transformed my dining room for under $X"
      - "You won't believe the before on this piece"
      - "I put this together in under 10 minutes"
  home_decor:
    es:
      - "El detalle que cambio toda mi sala"
      - "Decorar con poco presupuesto: esto fue lo mejor"
      - "Asi se ve mi espacio antes y despues"
    en:
      - "The one detail that changed my whole living room"
      - "Decorating on a budget: this was the best find"
      - "My space before and after"
  winter_clothing:
    es:
      - "Mi arma secreta para el frio"
      - "Calentita y con estilo, asi de facil"
      - "Lo que uso para no pasar frio este invierno"
    en:
      - "My secret weapon for the cold"
      - "Warm and stylish, it's that easy"
      - "What I wear to stay warm this winter"
  shoes:
    es:
      - "Los zapatos que combino con todo"
      - "Comodos TODO el dia, te lo juro"
      - "El par que no sabia que necesitaba"
    en:
      - "The shoes I wear with everything"
      - "Comfortable ALL day, I promise"
      - "The pair I didn't know I needed"
  pet_furniture:
    es:
      - "Mi gato no se baja de esto"
      - "Lo compre para mi mascota y ahora es mi favorito tambien"
      - "Asi reacciono mi perro cuando lo vio"
    en:
      - "My cat won't get off of this"
      - "I bought it for my pet and now it's my favorite too"
      - "This is how my dog reacted when he saw it"
  home_storage:
    es:
      - "Asi organice todo en un fin de semana"
      - "El closet que necesitabas ver"
      - "Guarde el doble con este truco"
    en:
      - "This is how I organized everything in one weekend"
      - "The closet you needed to see"
      - "I doubled my storage with this trick"
  costumes:
    es:
      - "El disfraz que todas me van a copiar"
      - "Listo en minutos para Halloween"
      - "Mi disfraz favorito de este año"
    en:
      - "The costume everyone's going to copy"
      - "Ready in minutes for Halloween"
      - "My favorite costume this year"
  pajamas:
    es:
      - "La pijama mas comoda que eh tenido"
      - "Asi me regalo a mi misma un buen dormir"
      - "El set de pijama perfecto para regalar"
    en:
      - "The comfiest pajamas I've ever owned"
      - "This is how I treat myself to a good night's sleep"
      - "The perfect pajama set to gift"
  activewear:
    es:
      - "Mi outfit para entrenar sin sacrificar estilo"
      - "Esto es lo que uso para mis rutinas"
      - "Comodo para entrenar, lindo para salir"
    en:
      - "My workout fit that doesn't sacrifice style"
      - "This is what I wear for my routines"
      - "Comfortable for the gym, cute for errands"

# shot_lists: 4-5 short steps per video-format archetype (es + en), shared
# across categories via category_to_shot_list below -- most apparel shares
# the same try-on structure, most home-goods share the same makeover
# structure, so the archetype is what actually differs, not the category.
# Per-category shot lists (rewritten 2026-10-15): the old 3 shared
# archetypes (try_on/room_makeover/pet_item) gave the same 5 steps to 8
# very different fashion categories and 3 very different home categories --
# a mattress, a dress and shapewear don't film the same way. One list per
# category now; category_to_shot_list below is the identity mapping so the
# frontend's existing shot_lists[category_to_shot_list[category]] lookup
# still works unchanged.
shot_lists:
  shapewear:
    es:
      - "Pruébate la faja frente al espejo"
      - "Primer plano estirando la tela para mostrar cómo se ajusta"
      - "Muestra el antes y después en la cintura"
      - "Enseña cómo se ve bajo la ropa"
      - "Llamado a la acción: \"link en el carrito naranja\""
    en:
      - "Try the shapewear on in front of the mirror"
      - "Close-up stretching the fabric to show the fit"
      - "Show the before/after at the waist"
      - "Show how it looks under clothes"
      - "Call to action: \"link in the orange cart\""
  dresses:
    es:
      - "Pruébate el vestido y gira para mostrar cómo cae"
      - "Primer plano de la tela y el detalle (encaje, botones)"
      - "Muestra cómo se ve con zapatos y accesorios"
      - "Cambia de ángulo: de frente, de perfil, caminando"
      - "Llamado a la acción: \"link en el carrito naranja\""
    en:
      - "Try the dress on and twirl to show how it falls"
      - "Close-up on the fabric and detail (lace, buttons)"
      - "Show it styled with shoes and accessories"
      - "Change angles: front, side, walking"
      - "Call to action: \"link in the orange cart\""
  sets:
    es:
      - "Pruébate el conjunto completo"
      - "Muestra cada pieza por separado antes de combinarlas"
      - "Primer plano del ajuste en la cintura"
      - "Estílalo con zapatos para un look completo"
      - "Llamado a la acción: \"link en el carrito naranja\""
    en:
      - "Try on the full set"
      - "Show each piece separately before combining them"
      - "Close-up on the fit at the waist"
      - "Style it with shoes for a complete look"
      - "Call to action: \"link in the orange cart\""
  furniture:
    es:
      - "Muestra el espacio vacío antes del mueble"
      - "Arma o coloca el mueble paso a paso"
      - "Primer plano de la calidad del material o acabado"
      - "Muestra el espacio ya transformado con el mueble puesto"
      - "Llamado a la acción: \"link en el carrito naranja\""
    en:
      - "Show the empty space before the furniture"
      - "Assemble or place the furniture step by step"
      - "Close-up on the material or finish quality"
      - "Show the space transformed with it in place"
      - "Call to action: \"link in the orange cart\""
  home_decor:
    es:
      - "Muestra el rincón antes de decorarlo"
      - "Coloca la decoración paso a paso"
      - "Primer plano de la textura o el detalle"
      - "Muestra el rincón terminado con buena luz"
      - "Llamado a la acción: \"link en el carrito naranja\""
    en:
      - "Show the corner before decorating"
      - "Place the decor piece step by step"
      - "Close-up on the texture or detail"
      - "Show the finished corner in good light"
      - "Call to action: \"link in the orange cart\""
  winter_clothing:
    es:
      - "Pruébate la prenda y muestra el abrigo que da"
      - "Primer plano de la tela o el forro por dentro"
      - "Combínala con otra prenda para un outfit completo"
      - "Muéstrate saliendo a la calle con ella puesta"
      - "Llamado a la acción: \"link en el carrito naranja\""
    en:
      - "Try the piece on and show how warm it looks"
      - "Close-up on the fabric or lining inside"
      - "Pair it with another piece for a full outfit"
      - "Show yourself heading outside wearing it"
      - "Call to action: \"link in the orange cart\""
  shoes:
    es:
      - "Muestra los zapatos de cerca, suela incluida"
      - "Pruébatelos y camina unos pasos"
      - "Combínalos con un outfit completo"
      - "Primer plano del material y los detalles"
      - "Llamado a la acción: \"link en el carrito naranja\""
    en:
      - "Show the shoes up close, including the sole"
      - "Try them on and walk a few steps"
      - "Style them with a full outfit"
      - "Close-up on the material and details"
      - "Call to action: \"link in the orange cart\""
  pet_furniture:
    es:
      - "Muestra el producto vacío antes de que tu mascota lo use"
      - "Acerca a tu mascota para que lo descubra"
      - "Grábala usándolo o jugando con él"
      - "Primer plano de la reacción de tu mascota"
      - "Llamado a la acción: \"link en el carrito naranja\""
    en:
      - "Show the product empty before your pet uses it"
      - "Bring your pet over to discover it"
      - "Film them using it or playing with it"
      - "Close-up on your pet's reaction"
      - "Call to action: \"link in the orange cart\""
  home_storage:
    es:
      - "Muestra el desorden antes de organizar"
      - "Usa el organizador paso a paso"
      - "Primer plano de cómo queda todo acomodado"
      - "Muestra el espacio ya organizado y despejado"
      - "Llamado a la acción: \"link en el carrito naranja\""
    en:
      - "Show the mess before organizing"
      - "Use the organizer step by step"
      - "Close-up on everything neatly arranged"
      - "Show the space organized and clear"
      - "Call to action: \"link in the orange cart\""
  costumes:
    es:
      - "Pruébate el disfraz completo"
      - "Muestra los detalles y accesorios de cerca"
      - "Posa o actúa el personaje por unos segundos"
      - "Compáralo con el precio de uno hecho a mano"
      - "Llamado a la acción: \"link en el carrito naranja\""
    en:
      - "Try on the full costume"
      - "Show the details and accessories up close"
      - "Pose or act out the character for a few seconds"
      - "Compare it to the price of a handmade one"
      - "Call to action: \"link in the orange cart\""
  pajamas:
    es:
      - "Pruébate el pijama y muestra lo cómodo que se ve"
      - "Primer plano de la tela"
      - "Muestra el conjunto completo, arriba y abajo"
      - "Enséñalo en un ambiente acogedor, en la cama o el sofá"
      - "Llamado a la acción: \"link en el carrito naranja\""
    en:
      - "Try the pajamas on and show how comfortable they look"
      - "Close-up on the fabric"
      - "Show the full set, top and bottom"
      - "Show it in a cozy setting, bed or couch"
      - "Call to action: \"link in the orange cart\""
  activewear:
    es:
      - "Pruébate la ropa deportiva y haz un movimiento rápido"
      - "Primer plano de la tela técnica o de compresión"
      - "Muestra cómo se mueve contigo, sentadilla o estiramiento"
      - "Combínala con otra prenda deportiva"
      - "Llamado a la acción: \"link en el carrito naranja\""
    en:
      - "Try the activewear on and do a quick move"
      - "Close-up on the technical or compression fabric"
      - "Show how it moves with you, a squat or a stretch"
      - "Pair it with another activewear piece"
      - "Call to action: \"link in the orange cart\""

category_to_shot_list:
  shapewear: shapewear
  dresses: dresses
  sets: sets
  winter_clothing: winter_clothing
  shoes: shoes
  costumes: costumes
  pajamas: pajamas
  activewear: activewear
  furniture: furniture
  home_decor: home_decor
  home_storage: home_storage
  pet_furniture: pet_furniture

# H2 (combos/bundles), part of the 2026-10-15 creator-workflow upgrade:
# complementary category pairs worth filming together in one video when
# both have a pick this week. Not every category pairs with another --
# unlisted categories simply never produce a combo suggestion.
combo_pairs:
  - categories: [shapewear, dresses]
    idea_es: "Pruébate la faja y el vestido juntos: antes y después en un solo video"
    idea_en: "Try the shapewear and the dress together: one before/after video"
  - categories: [sets, shoes]
    idea_es: "Un video de look completo: el conjunto con estos zapatos"
    idea_en: "A full-look video: the set with these shoes"
  - categories: [winter_clothing, shoes]
    idea_es: "Outfit de invierno completo: la ropa con los zapatos"
    idea_en: "A full winter outfit: the clothing with the shoes"
  - categories: [furniture, home_decor]
    idea_es: "Transforma el rincón: el mueble y la decoración en el mismo video"
    idea_en: "Transform the corner: the furniture and the decor in one video"
  - categories: [home_decor, home_storage]
    idea_es: "Organiza y decora a la vez: un video de antes y después"
    idea_en: "Organize and decorate at once: a before/after video"
  - categories: [pet_furniture, home_decor]
    idea_es: "El rincón de tu mascota, decorado: dos productos, un video"
    idea_en: "Your pet's corner, decorated: two products, one video"

# Category "fit" keywords for combos only (added 2026-10-15): a product's
# FastMoss category assignment is sometimes wrong for what the title
# actually is (real case: a "Silent Vibration Wrist-Worn Device" sleep
# gadget got tagged home_decor and paired with a dining chair). Before
# pairing two products for a combo, each title must contain at least one of
# its own category's keywords (case-insensitive substring match) -- doesn't
# affect anything outside combos.
category_fit_keywords:
  shapewear: [shapewear, faja, bodysuit, shaper, corset, "tummy control", fajas]
  dresses: [dress, vestido, gown]
  sets: [set, conjunto, jumpsuit, "2 piece", "two piece", "two-piece"]
  shoes: [shoe, shoes, boot, sandal, clog, sneaker, heel, slipper, zapato]
  winter_clothing: [jacket, sweater, coat, hoodie, fleece, thermal, cardigan]
  furniture: [chair, table, sofa, couch, bed, desk, shelf, cabinet, dresser, nightstand, mattress, stool, bench, wardrobe]
  home_decor: [decor, "wall art", curtain, rug, candle, vase, frame, pillow, lamp, ornament, decoration]
  home_storage: [storage, organizer, organiser, bin, basket, rack, closet, container, drawer]
  pet_furniture: [pet, dog, cat, kennel, "scratching post", "cat tree", leash, collar]
