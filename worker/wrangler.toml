name = "product-radar-search"
main = "src/index.js"
compatibility_date = "2026-10-15"

# Plain (non-secret) config. FASTMOSS_API_KEY and SEARCH_PASSWORD are set
# with `wrangler secret put <NAME>` instead -- never put them here.
[vars]
CREDIT_RESET_DATE = "2026-11-15"

# Create with `wrangler kv namespace create product-radar-search-kv`, then
# paste the id it prints below (see the setup walkthrough).
[[kv_namespaces]]
binding = "SEARCH_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
