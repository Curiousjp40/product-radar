name: Weekly run

# Mon 6:15 AM ET during EDT (UTC-4) -- today's goal (first auto run 2026-10-19
# EDT) uses 10:15 UTC. ET reverts to EST (UTC-5) on 2026-11-01 (DST ends), at
# which point this cron needs to move to "15 11 * * 1" to keep firing at
# 6:15 AM local -- GitHub Actions cron is always UTC, it does not follow DST.
on:
  schedule:
    - cron: "15 10 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  weekly-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine
        run: pip install -e .

      - name: Run the real weekly pipeline
        env:
          FASTMOSS_API_KEY: ${{ secrets.FASTMOSS_API_KEY }}
        run: python -m engine.run --budget 75 --print-picks

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data data/radar.db data/snapshots docs/credit_log.md
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Weekly run: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Send the Spanish Monday digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL || 'https://curiousjp40.github.io/product-radar/' }}
        run: |
          if [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ] || [ -z "$DIGEST_TO" ]; then
            echo "Gmail secrets not set yet; skipping the digest email."
            exit 0
          fi
          python -m engine.digest
