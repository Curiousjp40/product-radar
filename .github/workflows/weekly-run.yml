name: Weekly run

# Mon 6:15 AM America/New_York, year-round, despite GitHub Actions cron
# always running in UTC and never following DST (added 2026-10-15, replacing
# the single EDT-only cron this previously had -- that one would have kept
# firing at 5:15 AM local once EST started 2026-11-01). Two schedules, one
# for each UTC offset ET ever uses; BOTH fire every Monday, so the first
# step below is the real gate -- it only lets the rest of the job run when
# the cron that fired matches today's America/New_York UTC offset (-0400
# EDT / -0500 EST), so a late-starting run still proceeds. The other one's run shows as
# "skipped", not failed. workflow_dispatch (manual runs) always proceeds.
on:
  schedule:
    - cron: "15 10 * * 1" # 6:15 AM EDT (UTC-4), roughly mid-Mar to early Nov
    - cron: "15 11 * * 1" # 6:15 AM EST (UTC-5), the rest of the year
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  weekly-run:
    runs-on: ubuntu-latest
    steps:
      - name: Only proceed at 6 AM America/New_York (DST-safe double-cron gate)
        id: tz_gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run -- skipping the hour check."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Gate on WHICH cron fired vs today's ET UTC offset, not on the
          # current hour: scheduled runs can start 30-60+ min late, and an
          # hour check would then skip BOTH crons and silently drop the week.
          offset=$(TZ=America/New_York date +%z)
          fired="${{ github.event.schedule }}"
          echo "Cron that fired: '$fired'; America/New_York offset: $offset"
          if { [ "$fired" = "15 10 * * 1" ] && [ "$offset" = "-0400" ]; } || \
             { [ "$fired" = "15 11 * * 1" ] && [ "$offset" = "-0500" ]; }; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "This cron is for the other DST offset -- skipping the rest of this run."
          fi

      - uses: actions/checkout@v4
        if: steps.tz_gate.outputs.proceed == 'true'
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: steps.tz_gate.outputs.proceed == 'true'
        with:
          python-version: "3.12"

      - name: Install engine
        if: steps.tz_gate.outputs.proceed == 'true'
        run: pip install -e .

      - name: Run the real weekly pipeline
        if: steps.tz_gate.outputs.proceed == 'true'
        env:
          FASTMOSS_API_KEY: ${{ secrets.FASTMOSS_API_KEY }}
        # No --budget: engine.run now computes it dynamically every run
        # (config/weights.yaml's credits section -- balance minus the
        # Buscar cuenta search reserve and 7b's monthly live-timing pull,
        # split across the Mondays left before the reset), logged plainly
        # at the top of this step's output. Added 2026-10-15, Part 1b.
        run: python -m engine.run --print-picks

      - name: Commit updated data
        if: steps.tz_gate.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data web/public/img data/radar.db data/snapshots docs/credit_log.md
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Weekly run: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Send the Spanish Monday digest
        if: steps.tz_gate.outputs.proceed == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL || 'https://curiousjp40.github.io/product-radar/' }}
        run: |
          if [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ] || [ -z "$DIGEST_TO" ]; then
            echo "Gmail secrets not set yet; skipping the digest email."
            exit 0
          fi
          python -m engine.digest
