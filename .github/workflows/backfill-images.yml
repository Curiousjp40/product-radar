name: Backfill images

# Re-downloads missing product photos / video thumbnails from the saved
# snapshots (0 FastMoss credits) and commits them. Manual trigger only.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install -e .
      - name: Download missing images
        run: python -m engine.backfill_images
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/img
          if git diff --cached --quiet; then
            echo "No new images."
          else
            git commit -m "Backfill missing product/video images"
            git push
          fi
