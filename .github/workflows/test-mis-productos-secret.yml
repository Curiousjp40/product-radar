name: Test Mis Productos secret

# Manual, read-only check that MIS_PRODUCTOS_TOKEN (the GitHub secret) and
# the Worker's /admin/mis-productos route still agree with each other --
# zero FastMoss credits (engine.earnings does one HTTP GET to our own
# Worker, no FastMoss call at all) and no DB write. Added 2026-10-16 to
# confirm the secret works right after rotating it, without running the
# full (paid) weekly pipeline just to test one step of it.
on:
  workflow_dispatch: {}

jobs:
  test-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install -e .
      - name: Read-only fetch from the Worker's admin route
        env:
          MIS_PRODUCTOS_TOKEN: ${{ secrets.MIS_PRODUCTOS_TOKEN }}
        run: python -m engine.earnings
